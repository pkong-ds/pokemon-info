name: pokemon-info
title: Pokemon Info
version: "0.2.1"
summary: Interactive terminal Pokedex with TUI browsing and CLI lookups
website: https://github.com/pkong-ds/pokemon-info
issues: https://github.com/pkong-ds/pokemon-info/issues
source-code: https://github.com/pkong-ds/pokemon-info
description: |
  A terminal Pokedex. Run it bare for an interactive TUI: browse every
  Pokemon and move with a fuzzy filter, embedded truecolor ASCII art,
  stat bars, type badges, evolution chains and flavor text, with the
  details fetched live from PokeAPI. Or stay on the command line: type
  a few letters, hit TAB, and pick from every Pokemon or move name.
  Name completion and art are embedded in the binary, so they work
  offline; details are fetched live.
license: MIT
base: core24
confinement: strict
grade: stable

platforms:
  amd64:
  arm64:

apps:
  pokemon-info:
    command: bin/pokemon-info
    completer: pokemon-info.bash
    plugs:
      - network

parts:
  pokemon-info:
    plugin: go
    source: .
    build-snaps:
      - go/latest/stable
    override-build: |
      CGO_ENABLED=0 go build -o "${CRAFT_PART_INSTALL}/bin/pokemon-info" ./cmd/pokemon-info
      "${CRAFT_PART_INSTALL}/bin/pokemon-info" completion bash > "${CRAFT_PART_INSTALL}/pokemon-info.bash"
